services:
  - type: web
    name: aetherguard-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Scientific wheels (numpy / scipy / astropy) are most reliable here.
      - key: PYTHON_VERSION
        value: 3.12.7
      # Set to the deployed frontend origin; unset allows any origin.
      - key: ALLOWED_ORIGINS
        sync: false
